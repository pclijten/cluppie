<title>Cluppie Veldplanner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: werkbalk boven, weekstrip, drie kolommen (in te plannen | tijdlijn per veld | controle/detail).
   Tokens volgen Cluppie (design.md): donker eerst, licht als tweede thema. */
:root{
  color-scheme:dark;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --t-2xs:11px;--t-xs:12px;--t-sm:13px;--t-md:14px;--t-base:15px;--t-xl:18px;--t-3xl:24px;--t-5xl:32px;
  --r-2xs:3px;--r-xs:6px;--r-s:10px;--radius:14px;--r-l:22px;--r-pill:999px;
  --dur-micro:120ms;--dur-short:220ms;
  --bg:#0e1116;--surface:#181d24;--surface-2:#1f262f;--card:#181d24;
  --ink:#f5f6f8;--ink-2:#8b95a1;--hair:rgba(255,255,255,.08);--line-d:rgba(255,255,255,.06);
  --accent:#f25a53;--accent-vlak:#cc2620;--accent-ink:#fdfdfe;--focus:#f25a53;
  --ok:#35c47a;--warn:#f5b13d;--info:#6db3ff;--fout:#f0565b;
  --b-onder:#6db3ff;--b-midden:#f5b13d;--b-boven:#35c47a;
  --veld:#16361f;--veld-2:#11291a;--kalk:rgba(255,255,255,.22);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --lift:0 10px 30px rgba(0,0,0,.5);
  --blok-ink:#f5f6f8;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#e9edf2;--surface:#ffffff;--surface-2:#eef1f4;--card:#ffffff;
  --ink:#1a1f26;--ink-2:#5a6572;--hair:rgba(15,22,32,.14);--line-d:rgba(15,22,32,.1);
  --accent:#c8211c;--accent-vlak:#c8211c;--focus:#c8211c;
  --ok:#178048;--warn:#8f5207;--info:#1f64b8;--fout:#c42a2f;
  --b-onder:#3d8de0;--b-midden:#d98a1f;--b-boven:#2a9d5c;
  --veld:#2e7d46;--veld-2:#28713f;--kalk:rgba(255,255,255,.6);
  --shadow:0 1px 2px rgba(15,22,32,.06),0 6px 18px rgba(15,22,32,.08);
  --lift:0 10px 30px rgba(15,22,32,.2);
  --blok-ink:#1a1f26;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#e9edf2;--surface:#ffffff;--surface-2:#eef1f4;--card:#ffffff;
  --ink:#1a1f26;--ink-2:#5a6572;--hair:rgba(15,22,32,.14);--line-d:rgba(15,22,32,.1);
  --accent:#c8211c;--accent-vlak:#c8211c;--focus:#c8211c;
  --ok:#178048;--warn:#8f5207;--info:#1f64b8;--fout:#c42a2f;
  --b-onder:#3d8de0;--b-midden:#d98a1f;--b-boven:#2a9d5c;
  --veld:#2e7d46;--veld-2:#28713f;--kalk:rgba(255,255,255,.6);
  --shadow:0 1px 2px rgba(15,22,32,.06),0 6px 18px rgba(15,22,32,.08);
  --lift:0 10px 30px rgba(15,22,32,.2);
  --blok-ink:#1a1f26;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--t-md);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.kop{font-family:var(--font-display);text-transform:uppercase;font-weight:800;letter-spacing:.01em;line-height:1}
.zacht{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
svg{flex:none}

/* knoppen en segmenten */
.knop{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:var(--r-s);border:1px solid var(--hair);
  background:var(--surface-2);cursor:pointer;font-weight:600;font-size:var(--t-sm);white-space:nowrap;transition:background-color var(--dur-micro),border-color var(--dur-micro)}
.knop:hover{border-color:color-mix(in srgb,var(--ink) 25%,transparent)}
.knop.fluo{background:var(--accent-vlak);color:var(--accent-ink);border-color:transparent}
.knop.fluo:hover{background:color-mix(in srgb,var(--accent-vlak) 88%,#fff)}
.knop.klein{min-height:28px;padding:0 10px;font-size:var(--t-xs)}
.knop.stil{background:transparent;border-color:transparent}
.knop:disabled{cursor:not-allowed;color:var(--ink-2);background:var(--surface)}
.teller{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--accent-ink) 22%,transparent);font-size:var(--t-2xs);font-weight:700}
.segment{display:inline-flex;background:var(--surface-2);border:1px solid var(--hair);border-radius:var(--r-s);padding:3px;gap:2px}
.segment button{border:0;background:transparent;min-height:30px;padding:0 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:var(--t-sm);color:var(--ink-2)}
.segment button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* werkbalk */
.balk{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:14px}
.balk .titel{display:flex;flex-direction:column;gap:4px;margin-right:auto;min-width:0}
.pad{font-size:var(--t-xs);color:var(--ink-2)}
.titel h1{margin:0;font-size:var(--t-5xl)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;padding:3px 10px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.status.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.status i{width:7px;height:7px;border-radius:50%;background:currentColor}
.rooster-kies{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acties{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* weekstrip */
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.dagk{position:relative;text-align:left;border:1px solid var(--hair);background:var(--surface);border-radius:var(--radius);padding:10px 12px 8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color var(--dur-micro),background-color var(--dur-micro)}
.dagk:hover{border-color:color-mix(in srgb,var(--ink) 25%,transparent)}
.dagk[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.dagk.drop{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.dagk .r1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dagk .kop{font-size:var(--t-xl)}
.dagk .meta{font-size:var(--t-2xs);color:var(--ink-2);display:flex;gap:8px;align-items:center}
.heat{display:flex;gap:1px;height:22px;align-items:flex-end}
.heat span{flex:1;background:color-mix(in srgb,var(--accent) 70%,transparent);border-radius:1px;min-height:2px}
.stip{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.stip.fout{color:var(--fout)}.stip.warn{color:var(--warn)}
.dagk .afw{font-size:var(--t-2xs);font-weight:600;color:var(--warn);display:flex;gap:4px;align-items:center}

/* hoofdindeling */
.werk{display:grid;grid-template-columns:232px minmax(0,1fr) 300px;gap:14px;align-items:start}
.paneel{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);min-width:0}
.paneel-kop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px}
.paneel-kop h2{margin:0;font-size:var(--t-xl)}

/* zijbalk */
.zij{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.zij.drop{outline:2px dashed var(--ink-2);outline-offset:-4px}
.zij .uitleg{font-size:var(--t-xs);color:var(--ink-2);padding:0 14px 8px;margin:0}
.groep{padding:4px 10px 10px}
.groep h3{font-size:var(--t-xs);font-weight:600;color:var(--ink-2);margin:6px 4px 6px;display:flex;align-items:center;gap:6px}
.groep h3 i{width:8px;height:8px;border-radius:2px}
.chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border-radius:var(--r-s);border:1px solid color-mix(in srgb,var(--bc) 45%,transparent);
  background:color-mix(in srgb,var(--bc) 14%,var(--surface));cursor:grab;touch-action:none;user-select:none}
.chip:active{cursor:grabbing}
.chip b{font-family:var(--font-display);font-size:var(--t-xl);text-transform:uppercase;letter-spacing:.01em}
.chip .wat{font-size:var(--t-2xs);color:var(--ink-2);display:block}
.chip .nog{margin-left:auto;font-size:var(--t-2xs);font-weight:700;padding:2px 7px;border-radius:var(--r-pill);background:var(--surface-2);white-space:nowrap}
.chip .nieuw{color:var(--info)}
.leeg{padding:16px 14px;color:var(--ink-2);font-size:var(--t-sm)}

/* tijdlijn */
.midden{display:flex;flex-direction:column;gap:14px;min-width:0}
.voorstelbalk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius);
  background:color-mix(in srgb,var(--info) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--info) 40%,transparent)}
.voorstelbalk p{margin:0;margin-right:auto;font-size:var(--t-sm)}
.tl-wrap{overflow-x:auto;overflow-y:hidden;border-radius:var(--radius)}
.tl{position:relative;min-width:640px;user-select:none}
.tl-as{display:flex;margin-left:var(--lab);height:26px;position:relative}
.tl-as span{position:absolute;top:6px;font-size:var(--t-2xs);color:var(--ink-2);transform:translateX(-50%)}
.rij{display:flex;border-top:1px solid var(--hair)}
.rij-lab{width:var(--lab);flex:none;padding:8px 10px;display:flex;flex-direction:column;gap:3px;position:sticky;left:0;background:var(--surface);z-index:3;border-right:1px solid var(--hair)}
.rij-lab .kop{font-size:var(--t-xl)}
.rij-lab small{font-size:var(--t-2xs);color:var(--ink-2);display:flex;align-items:center;gap:4px}
.rij-lab .geenlicht{color:var(--warn)}
.baan{position:relative;flex:1;height:112px}
.baan .lijn{position:absolute;left:0;right:0;border-top:1px dashed var(--line-d)}
.baan .lijn.half{border-top:1px solid var(--hair)}
.baan .kwartier{position:absolute;top:0;bottom:0;border-left:1px solid var(--line-d)}
.baan .uur{border-left-color:var(--hair)}
.baan .donker{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--ink) 6%,transparent) 6px 7px)}
.lane-lab{position:absolute;left:4px;font-size:9px;color:var(--ink-2);opacity:.7;pointer-events:none;line-height:1}

.blok{position:absolute;border-radius:var(--r-xs);padding:3px 7px;overflow:hidden;cursor:grab;touch-action:none;
  background:color-mix(in srgb,var(--bc) 26%,var(--surface));border:1px solid color-mix(in srgb,var(--bc) 70%,transparent);color:var(--blok-ink);
  display:flex;flex-direction:column;justify-content:center;gap:1px;line-height:1.15;transition:box-shadow var(--dur-micro),opacity var(--dur-micro);z-index:2}
.blok:hover{box-shadow:var(--shadow)}
.blok .t{font-family:var(--font-display);font-weight:700;font-size:var(--t-base);text-transform:uppercase;white-space:nowrap}
.blok .s{font-size:var(--t-2xs);color:color-mix(in srgb,var(--blok-ink) 75%,transparent);white-space:nowrap;display:flex;gap:6px;align-items:center}
.blok.een{flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;padding:0 6px}
.blok.een .t{font-size:var(--t-sm)}
.blok.gekozen{box-shadow:0 0 0 2px var(--ink);z-index:4}
.blok.botsing{border-color:var(--fout);border-width:2px;background:color-mix(in srgb,var(--fout) 20%,var(--surface))}
.blok.waarsch::after,.blok.botsing::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.blok.botsing::after{background:var(--fout)}
.blok.voorstel{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bc) 22%,var(--surface)) 0 7px,color-mix(in srgb,var(--bc) 10%,var(--surface)) 7px 14px);border-style:dashed}
.blok.gewijzigd .t::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--info);margin-right:5px;vertical-align:middle}
.blok.slepend{opacity:.35}
.blok.kkdoel{box-shadow:0 0 0 2px var(--ok)}
.blok .greep{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:ew-resize}
.blok .greep::after{content:"";position:absolute;right:2px;top:30%;bottom:30%;width:2px;border-radius:1px;background:color-mix(in srgb,var(--blok-ink) 40%,transparent)}
.spook{position:absolute;border-radius:var(--r-xs);border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent);z-index:6;pointer-events:none;
  display:flex;align-items:center;padding:0 8px;font-size:var(--t-2xs);font-weight:700;white-space:nowrap;overflow:hidden}
.spook.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,transparent)}
.spook.fout{border-color:var(--fout);background:color-mix(in srgb,var(--fout) 20%,transparent)}
.zweef{position:fixed;z-index:50;pointer-events:none;padding:6px 10px;border-radius:var(--r-s);background:var(--ink);color:var(--bg);font-size:var(--t-xs);font-weight:600;box-shadow:var(--lift);max-width:280px}
.peil{position:absolute;top:26px;bottom:0;width:1px;background:color-mix(in srgb,var(--ink) 45%,transparent);pointer-events:none;z-index:5}
.peil span{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:var(--t-2xs);font-weight:700;background:var(--ink);color:var(--bg);padding:2px 6px;border-radius:var(--r-2xs)}

/* kleedkamerstrook */
.kk-kop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px 4px;flex-wrap:wrap}
.kk-kop h2{margin:0;font-size:var(--t-xl)}
.kk-rij{display:flex;border-top:1px solid var(--line-d)}
.kk-lab{width:var(--lab);flex:none;padding:0 10px;display:flex;align-items:center;position:sticky;left:0;background:var(--surface);z-index:3;border-right:1px solid var(--hair)}
.kk-chip{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;padding:2px 8px;border-radius:var(--r-pill);border:1px solid var(--hair);background:var(--surface-2);cursor:grab;touch-action:none}
.kk-baan{position:relative;flex:1;height:22px}
.kk-bar{position:absolute;top:3px;bottom:3px;border-radius:var(--r-2xs);font-size:10px;font-weight:600;display:flex;align-items:center;padding:0 5px;overflow:hidden;white-space:nowrap;
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bc) 30%,transparent) 0 4px,color-mix(in srgb,var(--bc) 14%,transparent) 4px 8px)}
.kk-bar i{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--bc) 45%,var(--surface));border-radius:var(--r-2xs)}
.kk-bar span{position:relative}
.kk-bar.fout{outline:2px solid var(--fout)}

/* legenda */
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;font-size:var(--t-2xs);color:var(--ink-2);border-top:1px solid var(--hair)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:14px;height:10px;border-radius:2px;display:inline-block}

/* rechterpaneel */
.rechts{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.samen{display:flex;gap:8px;padding:0 14px 10px}
.samen div{flex:1;border-radius:var(--r-s);padding:8px 10px;background:var(--surface-2)}
.samen b{display:block;font-family:var(--font-display);font-size:var(--t-3xl)}
.samen .f b{color:var(--fout)}.samen .w b{color:var(--warn)}
.mld{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line-d);font-size:var(--t-sm);align-items:flex-start}
.mld .ic{margin-top:2px}
.mld.fout .ic{color:var(--fout)}.mld.warn .ic{color:var(--warn)}
.mld p{margin:0 0 6px}
.mld .dag{font-size:var(--t-2xs);color:var(--ink-2);font-weight:600}
.mld .kn{display:flex;gap:6px;flex-wrap:wrap}
.alles-goed{padding:18px 14px;display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:600;font-size:var(--t-sm)}

.detail{padding:0 14px 14px;display:flex;flex-direction:column;gap:14px}
.detail .naam{font-size:var(--t-5xl)}
.veld-label{font-size:var(--t-xs);color:var(--ink-2);font-weight:600;margin-bottom:6px;display:block}
.tijden{display:flex;gap:8px;align-items:center}
.invoer{min-height:36px;padding:0 10px;border-radius:var(--r-s);border:1px solid var(--hair);background:var(--surface-2);width:100%}
.kkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kkgrid button{min-height:44px;border-radius:var(--r-s);border:1px solid var(--hair);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:var(--t-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.kkgrid button small{font-size:9px;font-weight:500;color:var(--ink-2)}
.kkgrid button[aria-pressed="true"]{background:var(--accent-vlak);color:var(--accent-ink);border-color:transparent}
.kkgrid button[aria-pressed="true"] small{color:inherit}
.kkgrid button.bezet{color:var(--ink-2);background:transparent;border-style:dashed}
.trainers{display:flex;flex-wrap:wrap;gap:6px}
.trainers span{font-size:var(--t-xs);padding:3px 8px;border-radius:var(--r-pill);background:var(--surface-2)}
.rijknop{display:flex;gap:8px;flex-wrap:wrap}
.minimld{font-size:var(--t-xs);display:flex;gap:6px;align-items:flex-start;margin:0}
.minimld.fout{color:var(--fout)}.minimld.warn{color:var(--warn)}

/* per team */
.tabelwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:var(--t-xs)}
th{text-align:left;font-weight:600;color:var(--ink-2);padding:10px;border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line-d);vertical-align:top}
td .t{font-family:var(--font-display);font-weight:700;font-size:var(--t-xl);text-transform:uppercase}
td.cel{cursor:pointer}
td.cel:hover{background:var(--surface-2)}
.sessie{display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--bc);padding-left:7px}
.sessie b{font-variant-numeric:tabular-nums}
.sessie.gewijzigd b::after{content:" · gewijzigd";color:var(--info);font-weight:600}
tr.bouwrij td{background:var(--surface-2);font-weight:700;color:var(--ink-2);padding:6px 10px}

/* kaart */
.kaartwrap{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.schuif{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.schuif input{flex:1;min-width:180px;accent-color:var(--accent)}
.schuif .kop{font-size:var(--t-5xl);min-width:96px}
.kaart svg{width:100%;height:auto;display:block;border-radius:var(--radius)}

/* vensters */
.waas{position:fixed;inset:0;background:rgba(8,10,14,.6);z-index:60;display:grid;place-items:center;padding:16px}
.venster{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-l);box-shadow:var(--lift);width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.venster h2{margin:0;font-size:var(--t-3xl)}
.venster .voet{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.wlijst{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.wlijst li{padding:10px 12px;border-radius:var(--r-s);background:var(--surface-2);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.wlijst .t{font-family:var(--font-display);font-weight:700;font-size:var(--t-xl);text-transform:uppercase;min-width:74px}
.wlijst .oud{color:var(--ink-2);text-decoration:line-through}
.wlijst .nw{font-weight:600}

}
const SJABLONEN = {

function bewaar(){ S.geschiedenis.push(kloon()); if (S.geschiedenis.length > 60) S.geschiedenis.shift(); }
function ongedaan(){ const v = S.geschiedenis.pop(); if (!v) return; const o = JSON.parse(v); S.blokken = o.b; o.v.forEach(x => Object.assign(VELD[x.id], x)); if (S.sel && !S.blokken.some(b => b.id === S.sel)) S.sel = null; teken(); meld('Laatste stap ongedaan gemaakt'); }
const blok = id => S.blokken.find(b => b.id === id);
const bc = t => `var(${BOUW[TEAMS[t].bouw].c})`;
const overlap = (a1, a2, b1, b2) => a1 < b2 && b1 < a2;
const kkVan = b => [b.start - KK_VOOR, b.eind + KK_NA];

/* ---------- controles ---------- */
function controleer(lijst = S.blokken){
  const uit = [], status = {};
  const zet = (ids, s) => ids.forEach(id => { if (s === 'botsing' || !status[id]) status[id] = s; });
  const voeg = (soort, dag, ids, tekst, fix) => { uit.push({ soort, dag, ids, tekst, fix }); zet(ids, soort === 'fout' ? 'botsing' : 'waarsch'); };
  for (let d = 1; d <= 5; d++){
    const dag = lijst.filter(b => b.dag === d);
    for (let i = 0; i < dag.length; i++) for (let j = i + 1; j < dag.length; j++){
      const a = dag[i], b = dag[j];
      const tijd = overlap(a.start, a.eind, b.start, b.eind);
      if (tijd && a.veld === b.veld && cellen(a.veld, a.deel).some(l => cellen(b.veld, b.deel).includes(l)))
        voeg('fout', d, [a.id, b.id], `${a.team} en ${b.team} staan tegelijk op ${VELD[a.veld].naam} (${tt(Math.max(a.start, b.start))}).`);
      const [a1, a2] = kkVan(a), [b1, b2] = kkVan(b), samen = a.kk.filter(k => b.kk.includes(k));
      if (samen.length && overlap(a1, a2, b1, b2))
        voeg('fout', d, [a.id, b.id], `Kleedkamer ${samen[0]} is dubbel: ${a.team} en ${b.team}.`, { soort:'kk', id:b.id });
      const tr = TEAMS[a.team].trainers.filter(x => TEAMS[b.team].trainers.includes(x));
      if (tr.length && tijd && a.team !== b.team)
        voeg('warn', d, [a.id, b.id], `${tr[0]} traint ${a.team} en ${b.team} tegelijk.`);
      if (a.team === b.team) voeg('warn', d, [a.id, b.id], `${a.team} traint twee keer op ${DAGEN[d].toLowerCase()}.`);
    }
    dag.forEach(b => {
      const t = TEAMS[b.team];
      if (t.bouw === 'onder' && b.eind > ONDER_TOT) voeg('warn', d, [b.id], `${b.team} (onderbouw) traint tot ${tt(b.eind)}. Advies: uiterlijk ${tt(ONDER_TOT)} klaar.`);
      if (!VELD[b.veld].licht && b.eind > DONKER) voeg('warn', d, [b.id], `${VELD[b.veld].naam} heeft geen licht, ${b.team} traint tot ${tt(b.eind)}. In de winter is het om 17:00 donker.`, { soort:'licht', id:b.id });
      if (deelVan(b.veld, b.deel) < NODIG[t.maat] - 1e-6) voeg('warn', d, [b.id], `${b.team} heeft een ${MAAT_NAAM[t.maat]} nodig en staat op ${vakVan(b.veld, b.deel).naam.toLowerCase()} (${pct(deelVan(b.veld, b.deel))}).`);
      if (!b.kk.length) voeg('warn', d, [b.id], `${b.team} heeft nog geen kleedkamer.`, { soort:'kk', id:b.id });
    });
  }
  return { lijst: uit, status };
}
const nogNodig = () => Object.values(TEAMS).map(t => ({ t, n: S.blokken.filter(b => b.team === t.id && !b.voorstel).length, v: S.blokken.filter(b => b.team === t.id && b.voorstel).length }))
  .filter(x => x.n + x.v < x.t.per);

function veldVrij(dag, veld, deel, start, eind, behalve, lijst = S.blokken){
  return !lijst.some(b => b.id !== behalve && b.dag === dag && b.veld === veld && overlap(start, eind, b.start, b.eind) && cellen(veld, b.deel).some(l => cellen(veld, deel).includes(l)));
}
function vrijeKk(dag, start, eind, behalve, lijst = S.blokken){
  const bezet = new Set(lijst.filter(b => b.id !== behalve && b.dag === dag && overlap(start - KK_VOOR, eind + KK_NA, b.start - KK_VOOR, b.eind + KK_NA)).flatMap(b => b.kk));
  return KKS.filter(k => !bezet.has(k));
}
function kkBezetter(dag, k, b){
  return S.blokken.find(x => x.id !== b.id && x.dag === dag && x.kk.includes(k) && overlap(b.start - KK_VOOR, b.eind + KK_NA, x.start - KK_VOOR, x.eind + KK_NA));
}

/* ---------- wijzigingen t.o.v. gepubliceerd ---------- */
function wijzigingen(){
  const per = {};
  const regel = b => `${DAGK[b.dag]} ${tt(b.start)}–${tt(b.eind)} · ${plekTekst(b)}${b.kk.length ? ' · kleedkamer ' + b.kk.join(', ') : ''}`;
  for (const t of Object.keys(TEAMS)){
    const nu = S.blokken.filter(b => b.team === t && !b.voorstel), oud = S.gepubliceerd.filter(b => b.team === t);
    const ks = new Set(nu.map(sleutel)), ko = new Set(oud.map(sleutel));
    const weg = oud.filter(b => !ks.has(sleutel(b))), erbij = nu.filter(b => !ko.has(sleutel(b)));
    if (weg.length || erbij.length) per[t] = { weg: weg.map(regel), erbij: erbij.map(regel), nieuweIds: erbij.map(b => b.id) };
  }
  return per;
}

/* ---------- Vul aan ---------- */
function vulAan(){
  bewaar();
  let n = 0;
  const lijst = S.blokken;
  for (const { t, n: heeft, v } of nogNodig()){
    let mist = t.per - heeft - v;
    const eigenDagen = () => lijst.filter(b => b.team === t.id).map(b => b.dag);
    const dagVolg = [1, 2, 3, 4, 5].sort((x, y) => {
      const ed = eigenDagen();
      const afst = d => ed.length ? Math.min(...ed.map(e => Math.abs(e - d))) : 3;
      return afst(y) - afst(x) || lijst.filter(b => b.dag === x).length - lijst.filter(b => b.dag === y).length;
    });
    const vroegst = t.bouw === 'onder' ? tm('17:00') : t.bouw === 'midden' ? tm('17:30') : tm('19:00');
    for (const d of dagVolg){
      if (!mist) break;
      if (eigenDagen().includes(d)) continue;
      let gevonden = null;
      for (let s = vroegst; s + t.duur <= DAG_EIND && !gevonden; s += STAP){
        const e = s + t.duur;
        if (t.bouw === 'onder' && e > ONDER_TOT) break;
        for (const v of VELDEN){
          if (!v.licht && e > DONKER) continue;
          const deel = passend(v.id, NODIG[t.maat]).map(k => k.id).find(dl => veldVrij(d, v.id, dl, s, e, null, lijst));
          if (!deel) continue;
          const trainerVrij = !lijst.some(b => b.dag === d && overlap(s, e, b.start, b.eind) && TEAMS[b.team].trainers.some(x => t.trainers.includes(x)));
          if (!trainerVrij) continue;
          const kk = vrijeKk(d, s, e, null, lijst);
          if (!kk.length) continue;
          gevonden = { id:'b' + (++teller), team:t.id, dag:d, start:s, eind:e, veld:v.id, deel, kk:[kk[0]], voorstel:true };
          break;
        }
      }
      if (gevonden){ lijst.push(gevonden); mist--; n++; }
    }
  }
  teken();
  meld(n ? `${n} ${n === 1 ? 'voorstel' : 'voorstellen'} ingepland. Ze staan gestreept tot je ze overneemt.` : 'Alle teams hebben al genoeg trainingen.');
}
const voorstellen = () => S.blokken.filter(b => b.voorstel);

}
const xVan = m => (m - DAG_START) / STAP * slotW;

  for (let m = DAG_START + STAP; m < DAG_EIND; m += STAP) raster.push(`<i class="kwartier${m % 60 === 0 ? ' uur' : ''}" style="left:${xVan(m)}px"></i>`);

  const kk = KKS.map(k => `<div class="kk-rij"><div class="kk-lab"><span class="kk-chip" data-kk="${k}" title="Sleep naar een team">${ic('deur', 12)}Kleedkamer ${k}</span></div>

/* hoogte van een baan: een veldrij is altijd RIJ_H hoog, verdeeld over zijn cellen */
const RIJ_H = 112;
const baanH = v => RIJ_H / (v.K * v.R);
const looptjes = ls => { const r = []; [...ls].sort((a, b) => a - b).forEach(l => { const z = r[r.length - 1]; z && z[1] === l - 1 ? z[1] = l : r.push([l, l]); }); return r; };
function baanLijnen(v){
  const h = baanH(v), uit = [];
  for (let i = 1; i < v.K * v.R; i++) uit.push(`<i class="lijn${i % v.R === 0 ? ' half' : ''}" style="top:${i * h}px"></i>`);
  if (h >= 13) for (let c = 0; c < v.K; c++) for (let r = 0; r < v.R; r++){
    const naam = v.K === 2 && v.R === 2 ? ['a voor','a achter','b voor','b achter'][c * 2 + r] : v.R === 1 ? `${c + 1}` : `${c + 1} ${r === 0 ? 'voor' : r === v.R - 1 ? 'achter' : 'midden'}`;
    uit.push(`<span class="lane-lab" style="top:${(c * v.R + r) * h + 2}px">${naam}</span>`); }
  return uit.join('');
}
function miniVeld(v, b = 22){
  const w = b * 1.5, cw = w / v.K, rh = b / v.R, l = [];
  for (let c = 1; c < v.K; c++) l.push(`<path d="M${c * cw} 0v${b}"/>`);
  for (let r = 1; r < v.R; r++) l.push(`<path d="M0 ${r * rh}h${w}"/>`);
  return `<svg width="${w}" height="${b}" viewBox="-1 -1 ${w + 2} ${b + 2}" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1"><rect width="${w}" height="${b}" rx="1.5"/><g stroke-dasharray="2 1.5">${l.join('')}</g></svg>`;
}
function htmlBlok(b, st, gewijzigd){
  const v = VELD[b.veld], h = baanH(v), runs = looptjes(cellen(b.veld, b.deel));
  const w = xVan(b.eind) - xVan(b.start);
  const kort = w < 90;
  const klas = `${st === 'botsing' ? ' botsing' : st === 'waarsch' ? ' waarsch' : ''}${b.voorstel ? ' voorstel' : ''}${gewijzigd ? ' gewijzigd' : ''}${S.sel === b.id ? ' gekozen' : ''}`;
  return runs.map(([l0, l1], i) => {
    const hoog = (l1 - l0 + 1) * h, een = hoog < 40;
    const stijl = `--bc:${bc(b.team)};left:${xVan(b.start) + 1}px;width:${w - 2}px;top:${l0 * h + 1}px;height:${hoog - 2}px`;
    if (i > 0) return `<div class="blok vervolg${klas}" data-id="${b.id}" aria-hidden="true" style="${stijl}"><span class="t">${b.team}</span></div>`;
    return `<div class="blok${een ? ' een' : ''}${klas}"
    tabindex="0" role="button" data-id="${b.id}" aria-label="${b.team}, ${tt(b.start)} tot ${tt(b.eind)}, ${plekTekst(b)}${b.kk.length ? ', kleedkamer ' + b.kk.join(' en ') : ''}"
    style="${stijl}">
    <span class="t">${b.team}</span>
    ${een ? `<span class="s num">${tt(b.start)}${kort ? '' : '–' + tt(b.eind)}${b.kk.length && !kort ? ` · ${ic('deur', 10)}${b.kk.join(',')}` : ''}</span>` : `<span class="s num">${tt(b.start)}–${tt(b.eind)}${b.kk.length ? ` · ${ic('deur', 10)}${b.kk.join(',')}` : ''}</span>`}
    <span class="greep" data-greep="1" aria-hidden="true"></span>

}

/* ---------- kaart: luchtfoto of getekend ---------- */
const POS = { v1:[20, 22], v2:[145, 22], v3:[20, 110], v4:[145, 110] }, VW = 105, VH = 68;
let fotoCache = null;
function luchtfoto(){
  /* In Cluppie: de echte luchtfoto (PDOK) uit de veldkaart. Een artifact mag geen foto's van buiten laden,
     dus hier een nagemaakte luchtfoto van een fictief sportpark. */
  if (fotoCache) return fotoCache;
  const Z = 4, c = document.createElement('canvas'); c.width = 330 * Z; c.height = 196 * Z;
  const g = c.getContext('2d'); g.scale(Z, Z);
  let zaad = 7; const rnd = () => (zaad = (zaad * 16807) % 2147483647) / 2147483647;
  g.fillStyle = '#58703a'; g.fillRect(0, 0, 330, 196);
  for (let i = 0; i < 2600; i++){ g.fillStyle = ['#4f6833','#647d42','#5a6f37','#6b7f45','#4a5f30'][i % 5]; g.globalAlpha = .35; g.fillRect(rnd() * 330, rnd() * 196, 1 + rnd() * 3, 1 + rnd() * 3); }
  g.globalAlpha = 1;
  /* weg en parkeerplaats */
  g.fillStyle = '#55585a'; g.fillRect(0, 182, 330, 14); g.fillStyle = '#d9d6cc'; for (let x = 4; x < 330; x += 14) g.fillRect(x, 188.6, 7, .7);
  g.fillStyle = '#6a6d6f'; g.fillRect(262, 150, 68, 30);
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = .4; for (let x = 265; x < 328; x += 6){ g.beginPath(); g.moveTo(x, 151); g.lineTo(x, 159); g.moveTo(x, 171); g.lineTo(x, 179); g.stroke(); }
  const auto = ['#c9ccd1','#2b2f36','#8a1f1f','#e8e8e8','#36506e','#9aa0a6'];
  for (let x = 266; x < 326; x += 6) if (rnd() > .3){ g.fillStyle = auto[Math.floor(rnd() * auto.length)]; g.fillRect(x - 2, 152 + rnd(), 4, 6.5); }
  for (let x = 266; x < 326; x += 6) if (rnd() > .45){ g.fillStyle = auto[Math.floor(rnd() * auto.length)]; g.fillRect(x - 2, 172 + rnd(), 4, 6.5); }
  /* paden */
  g.fillStyle = '#b9b2a2'; g.fillRect(127, 14, 16, 168); g.fillRect(14, 92, 248, 14); g.fillRect(143, 140, 119, 8);
  /* bomen langs de rand */
  const boom = (x, y, r) => { g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.arc(x + r * .5, y + r * .5, r, 0, 7); g.fill();
    g.fillStyle = ['#2f4a23','#36542a','#2a4220'][Math.floor(rnd() * 3)]; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = 'rgba(120,160,80,.25)'; g.beginPath(); g.arc(x - r * .3, y - r * .3, r * .5, 0, 7); g.fill(); };
  for (let x = 4; x < 262; x += 7 + rnd() * 4) boom(x, 5 + rnd() * 4, 3 + rnd() * 2.5);
  for (let y = 16; y < 178; y += 7 + rnd() * 4) boom(5 + rnd() * 3, y, 3 + rnd() * 2.5);
  for (let y = 16; y < 140; y += 8 + rnd() * 4) boom(325 - rnd() * 3, y, 3 + rnd() * 2);
  /* velden */
  VELDEN.forEach(v => {
    const [x, y] = POS[v.id], kunst = v.ondergrond === 'Kunstgras';
    g.fillStyle = kunst ? '#3c7f43' : '#6c9a46'; g.fillRect(x - 3, y - 3, VW + 6, VH + 6);
    for (let i = 0; i < 10; i++){ g.fillStyle = i % 2 ? (kunst ? '#3a7a40' : '#5f8d3d') : (kunst ? '#408746' : '#73a34c'); g.fillRect(x + i * VW / 10, y, VW / 10, VH); }
    if (!kunst){ for (let i = 0; i < 90; i++){ g.fillStyle = 'rgba(150,130,80,.18)'; g.fillRect(x + rnd() * VW, y + rnd() * VH, 1.2, 1.2); }
      [[x + 8, y + VH / 2], [x + VW - 8, y + VH / 2], [x + VW / 2, y + VH / 2]].forEach(([a, b]) => { g.fillStyle = 'rgba(140,115,70,.35)'; g.beginPath(); g.ellipse(a, b, 6, 9, 0, 0, 7); g.fill(); }); }
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = .45;
    g.strokeRect(x + 2, y + 2, VW - 4, VH - 4);
    g.beginPath(); g.moveTo(x + VW / 2, y + 2); g.lineTo(x + VW / 2, y + VH - 2); g.stroke();
    g.beginPath(); g.arc(x + VW / 2, y + VH / 2, 8.5, 0, 7); g.stroke();
    g.strokeRect(x + 2, y + VH / 2 - 18, 15, 36); g.strokeRect(x + VW - 17, y + VH / 2 - 18, 15, 36);
    g.strokeRect(x + 2, y + VH / 2 - 8, 5, 16); g.strokeRect(x + VW - 7, y + VH / 2 - 8, 5, 16);
    if (v.licht) [[x - 4, y - 4], [x + VW / 2, y - 5], [x + VW + 4, y - 4], [x - 4, y + VH + 4], [x + VW / 2, y + VH + 5], [x + VW + 4, y + VH + 4]].forEach(([a, b]) => {
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 1; g.beginPath(); g.moveTo(a, b); g.lineTo(a + 7, b + 7); g.stroke();
      g.fillStyle = '#d8d8d0'; g.beginPath(); g.arc(a, b, 1.1, 0, 7); g.fill(); });
  });
  /* clubgebouw */
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(270, 24, 54, 122);
  g.fillStyle = '#7d6a5c'; g.fillRect(266, 20, 54, 122); g.fillStyle = '#8f7b6b'; g.fillRect(266, 20, 27, 122);
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = .5; g.beginPath(); g.moveTo(293, 20); g.lineTo(293, 142); g.stroke();
  g.fillStyle = '#a7a39a'; g.fillRect(276, 60, 8, 6); g.fillRect(300, 100, 10, 7);
  fotoCache = c.toDataURL('image/jpeg', .86);
  return fotoCache;
}
function htmlKaart(){

  const veldSvg = VELDEN.map(v => {
    const [x, y] = POS[v.id], cw = VW / v.K, rh = VH / v.R;
    const strepen = foto ? '' : Array.from({ length: 10 }, (_, i) => `<rect x="${x + i * VW / 10}" y="${y}" width="${VW / 10}" height="${VH}" style="fill:${i % 2 ? 'var(--veld-2)' : 'var(--veld)'}"/>`).join('');
    const raster = [];
    for (let c = 1; c < v.K; c++) raster.push(`<path d="M${x + c * cw} ${y}v${VH}"/>`);
    for (let r = 1; r < v.R; r++) raster.push(`<path d="M${x} ${y + r * rh}h${VW}"/>`);
    const vlakken = actief.filter(b => b.veld === v.id).map(b => {
      const k = vakVan(b.veld, b.deel);
      const px = x + k.c0 * cw, py = y + k.r0 * rh, pw = (k.c1 - k.c0 + 1) * cw, ph = (k.r1 - k.r0 + 1) * rh;
      const groot = pw > 40 && ph > 24;
      return `<g class="kvak"><rect x="${px + 1.2}" y="${py + 1.2}" width="${pw - 2.4}" height="${ph - 2.4}" rx="3" style="fill:${bc(b.team)};stroke:${foto ? '#fff' : bc(b.team)}" fill-opacity="${foto ? .5 : .78}" stroke-width="${foto ? .8 : 1}"/>
        <text x="${px + pw / 2}" y="${py + ph / 2 + (groot ? 0 : 2)}" text-anchor="middle" class="klabel" font-size="${groot ? 8.5 : 6.5}">${b.team}</text>
        ${groot ? `<text x="${px + pw / 2}" y="${py + ph / 2 + 7}" text-anchor="middle" class="klabel klein" font-size="4.6">${tt(b.start)}–${tt(b.eind)} · kk ${b.kk.join(',') || '–'}</text>` : ''}</g>`;
    }).join('');
    const donker = !v.licht && t >= DONKER;
    return `<g class="kveld" data-indeling="${v.id}" role="button" tabindex="0" aria-label="Indeling van ${v.naam}">
      ${foto ? `<rect x="${x}" y="${y}" width="${VW}" height="${VH}" fill="transparent"/>` : `<rect x="${x - 3}" y="${y - 3}" width="${VW + 6}" height="${VH + 6}" rx="4" style="fill:var(--veld)"/>${strepen}
      <g fill="none" style="stroke:var(--kalk)" stroke-width=".8"><rect x="${x + 2}" y="${y + 2}" width="${VW - 4}" height="${VH - 4}"/><path d="M${x + VW / 2} ${y + 2}v${VH - 4}"/><circle cx="${x + VW / 2}" cy="${y + VH / 2}" r="8.5"/>
      <rect x="${x + 2}" y="${y + VH / 2 - 18}" width="15" height="36"/><rect x="${x + VW - 17}" y="${y + VH / 2 - 18}" width="15" height="36"/></g>`}
      <g fill="none" stroke="${foto ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.4)'}" stroke-width=".6" stroke-dasharray="2.5 2">${raster.join('')}</g>
      ${vlakken}
      ${donker ? `<rect x="${x}" y="${y}" width="${VW}" height="${VH}" rx="2" fill="#000" fill-opacity=".6"/><text x="${x + VW / 2}" y="${y + VH / 2 + 3}" text-anchor="middle" font-size="6" fill="#fff">Donker, geen licht</text>` : ''}
      <text x="${x}" y="${y - 5}" class="kveldnaam" font-size="7.5">${v.naam.toUpperCase()}<tspan class="ksub" font-size="5" dx="4">${v.ondergrond.toLowerCase()} · ${v.sjabloon === 'standaard' ? 'standaard indeling' : v.sjabloon === 'eigen' ? 'eigen indeling' : SJABLONEN[v.sjabloon].naam.toLowerCase()}</tspan></text>
    </g>`;
  }).join('');
  const kkSvg = KKS.map((k, i) => {
    const b = S.blokken.find(x => x.dag === S.dag && x.kk.includes(k) && x.start - KK_VOOR <= t && x.eind + KK_NA > t);
    const x = 270 + (i % 2) * 24, y = 36 + Math.floor(i / 2) * 26;
    return `<g><rect x="${x}" y="${y}" width="22" height="23" rx="3" style="fill:${b ? bc(b.team) : foto ? 'rgba(20,20,20,.45)' : 'var(--surface-2)'};stroke:${foto ? 'rgba(255,255,255,.7)' : 'var(--hair)'}" fill-opacity="${b ? .85 : 1}"/>
      <text x="${x + 11}" y="${y + 10}" text-anchor="middle" font-size="6.5" font-weight="700" class="kklabel">${k}</text>
      ${b ? `<text x="${x + 11}" y="${y + 18.5}" text-anchor="middle" font-size="4" class="kklabel">${b.team}</text>` : ''}</g>`;
  }).join('');
  return `<section class="paneel kaart${foto ? ' foto' : ''}"><div class="paneel-kop"><h2 class="kop">Sportpark · ${DAGEN[S.dag]}</h2>

    <div class="kaartwrap">

        <input type="range" id="tijdschuif" min="${DAG_START}" max="${DAG_EIND - STAP}" step="${STAP}" value="${t}" aria-label="Tijdstip">

          <rect x="127" y="14" width="16" height="168" style="fill:var(--surface-2)"/><rect x="14" y="94" width="248" height="12" style="fill:var(--surface-2)"/>`}
        ${veldSvg}
        ${foto ? '' : `<rect x="264" y="20" width="56" height="124" rx="6" style="fill:var(--surface);stroke:var(--hair)"/>`}
        <text x="292" y="30" text-anchor="middle" font-size="5.5" font-weight="700" class="kveldnaam">KLEEDKAMERS</text>
        ${kkSvg}
        <text x="${foto ? 326 : 292}" y="${foto ? 193 : 154}" text-anchor="${foto ? 'end' : 'middle'}" font-size="4.5" class="ksub">${foto ? 'Nagemaakte luchtfoto · in Cluppie de echte (PDOK)' : 'Clubgebouw'}</text>
      </svg>
      <p class="zacht" style="margin:0;font-size:var(--t-xs)">Tik op een veld om de indeling te wijzigen. De stippellijnen tonen hoe elk veld is ingedeeld.</p>
    </div></section>`;
}

/* ---------- veldindeling maken ---------- */
function vensterIndeling(veldId){
  const V = VELD[veldId];
  const ed = { K:V.K, R:V.R, sjabloon:V.sjabloon, vakken:JSON.parse(JSON.stringify(V.vakken)), sel:null, hl:null, teller:1 };
  const W = 315, H = 204;
  const zetSjabloon = k => { const sj = SJABLONEN[k]; ed.K = sj.K; ed.R = sj.R; ed.vakken = sj.vakken(); ed.sjabloon = k; ed.sel = null; };
  const zetRaster = (K, R) => { ed.K = K; ed.R = R; ed.vakken = vakkenStandaard(K, R); ed.sjabloon = 'eigen'; ed.sel = null;
    if (K % 2) ed.vakken.push(...Array.from({ length:K }, (_, i) => ({ id:'k' + (i + 1), naam:`Deel ${i + 1}`, kort:`deel ${i + 1}`, c0:i, c1:i, r0:0, r1:R - 1 }))); };
  const frac = k => (k.c1 - k.c0 + 1) * (k.r1 - k.r0 + 1) / (ed.K * ed.R);
  const render = () => {
    const cw = W / ed.K, rh = H / ed.R, cel = [];
    for (let c = 0; c < ed.K; c++) for (let r = 0; r < ed.R; r++){
      const in_ = ed.sel && c >= Math.min(ed.sel.c0, ed.sel.c1) && c <= Math.max(ed.sel.c0, ed.sel.c1) && r >= Math.min(ed.sel.r0, ed.sel.r1) && r <= Math.max(ed.sel.r0, ed.sel.r1);
      cel.push(`<rect class="icel${in_ ? ' aan' : ''}" data-c="${c}" data-r="${r}" x="${c * cw + 1}" y="${r * rh + 1}" width="${cw - 2}" height="${rh - 2}" rx="4"/>`); }
    const hl = ed.hl && ed.vakken.find(k => k.id === ed.hl);
    const sel = ed.sel && { c0:Math.min(ed.sel.c0, ed.sel.c1), c1:Math.max(ed.sel.c0, ed.sel.c1), r0:Math.min(ed.sel.r0, ed.sel.r1), r1:Math.max(ed.sel.r0, ed.sel.r1) };
    venster(`<h2 class="kop">Indeling van ${V.naam}</h2>
      <p class="zacht" style="margin:0">Kies een sjabloon of maak eigen vakken: sleep over de vakjes van het veld. Een team kan elk vak krijgen dat groot genoeg is.</p>
      <div><span class="veld-label">Sjabloon</span><div class="keus">${Object.entries(SJABLONEN).map(([k, sj]) => `<button type="button" data-sj="${k}" aria-pressed="${ed.sjabloon === k}">${sj.naam}</button>`).join('')}</div></div>
      <div class="tijden" style="flex-wrap:wrap;gap:12px">
        <span><span class="veld-label">Stukken in de lengte</span><span class="segment">${[1,2,3,4,5,6].map(n => `<button type="button" data-k="${n}" aria-pressed="${ed.K === n}">${n}</button>`).join('')}</span></span>
        <span><span class="veld-label">In de breedte</span><span class="segment">${[1,2,3].map(n => `<button type="button" data-r="${n}" aria-pressed="${ed.R === n}">${n}</button>`).join('')}</span></span></div>
      <svg class="iveld" viewBox="-6 -6 ${W + 12} ${H + 12}" role="img" aria-label="Veld met ${ed.K * ed.R} vakjes">
        <rect x="-6" y="-6" width="${W + 12}" height="${H + 12}" rx="8" style="fill:var(--veld)"/>
        ${Array.from({ length:10 }, (_, i) => `<rect x="${i * W / 10}" y="0" width="${W / 10}" height="${H}" style="fill:${i % 2 ? 'var(--veld-2)' : 'var(--veld)'}"/>`).join('')}
        <g fill="none" style="stroke:var(--kalk)" stroke-width="1.6"><rect x="0" y="0" width="${W}" height="${H}"/><path d="M${W / 2} 0v${H}"/><circle cx="${W / 2}" cy="${H / 2}" r="26"/>
          <rect x="0" y="${H / 2 - 54}" width="45" height="108"/><rect x="${W - 45}" y="${H / 2 - 54}" width="45" height="108"/></g>
        ${cel.join('')}
        ${hl ? `<rect x="${hl.c0 * cw + 3}" y="${hl.r0 * rh + 3}" width="${(hl.c1 - hl.c0 + 1) * cw - 6}" height="${(hl.r1 - hl.r0 + 1) * rh - 6}" rx="6" class="ihl"/>` : ''}
      </svg>
      ${sel ? `<div class="nieuwvak"><label class="veld-label" for="i-naam">Nieuw vak · ${pct((sel.c1 - sel.c0 + 1) * (sel.r1 - sel.r0 + 1) / (ed.K * ed.R))}</label>
        <div class="tijden"><input class="invoer" id="i-naam" value="${ed.naam || ''}" placeholder="Bijv. Keepershoek of Pannakooi"><button type="button" class="knop fluo" id="i-voeg">Toevoegen</button></div></div>` : ''}
      <div><span class="veld-label">Vakken op dit veld (${ed.vakken.length})</span>
        <div class="vaklijst">${ed.vakken.map(k => `<span class="vakchip${ed.hl === k.id ? ' aan' : ''}" data-hl="${k.id}"><b>${k.naam}</b><small>${pct(frac(k))}</small>${k.id === 'h' ? '' : `<button type="button" data-weg="${k.id}" aria-label="Verwijder ${k.naam}">${ic('x', 12)}</button>`}</span>`).join('')}</div></div>
      <p class="zacht" style="margin:0;font-size:var(--t-xs)">Trainingen op dit veld gaan bij opslaan mee naar het vak dat het best past.</p>
      <div class="voet"><button type="button" class="knop" id="v-sluit">Annuleren</button><button type="button" class="knop fluo" id="v-ok">Opslaan</button></div>`);
    laag.querySelectorAll('[data-sj]').forEach(x => x.onclick = () => { zetSjabloon(x.dataset.sj); render(); });
    laag.querySelectorAll('[data-k]').forEach(x => x.onclick = () => { zetRaster(+x.dataset.k, ed.R); render(); });
    laag.querySelectorAll('[data-r]').forEach(x => x.onclick = () => { zetRaster(ed.K, +x.dataset.r); render(); });
    laag.querySelectorAll('[data-hl]').forEach(x => x.onclick = e => { if (e.target.closest('[data-weg]')) return; ed.hl = ed.hl === x.dataset.hl ? null : x.dataset.hl; render(); });
    laag.querySelectorAll('[data-weg]').forEach(x => x.onclick = () => { ed.vakken = ed.vakken.filter(k => k.id !== x.dataset.weg); ed.sjabloon = 'eigen'; ed.hl = null; render(); });
    const svg = laag.querySelector('.iveld');
    let bezig = false;
    const celOnder = e => { const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.classList.contains('icel') ? { c:+el.dataset.c, r:+el.dataset.r } : null; };
    const kleur = () => svg.querySelectorAll('.icel').forEach(el => { const c = +el.dataset.c, r = +el.dataset.r;
      el.classList.toggle('aan', !!ed.sel && c >= Math.min(ed.sel.c0, ed.sel.c1) && c <= Math.max(ed.sel.c0, ed.sel.c1) && r >= Math.min(ed.sel.r0, ed.sel.r1) && r <= Math.max(ed.sel.r0, ed.sel.r1)); });
    svg.addEventListener('pointerdown', e => { const c = celOnder(e); if (!c) return; e.preventDefault(); bezig = true; ed.hl = null; ed.sel = { c0:c.c, c1:c.c, r0:c.r, r1:c.r }; kleur(); });
    svg.addEventListener('pointermove', e => { if (!bezig) return; const c = celOnder(e); if (c){ ed.sel.c1 = c.c; ed.sel.r1 = c.r; kleur(); } });
    const klaar = () => { if (!bezig) return; bezig = false; ed.naam = `Eigen vak ${ed.teller}`; render(); laag.querySelector('#i-naam')?.select(); };
    svg.addEventListener('pointerup', klaar); svg.addEventListener('pointerleave', klaar);
    const voeg = laag.querySelector('#i-voeg');
    voeg && (voeg.onclick = () => { const n = laag.querySelector('#i-naam').value.trim() || `Eigen vak ${ed.teller}`;
      ed.vakken.push({ id:'x' + Date.now().toString(36) + ed.teller, naam:n, kort:n.toLowerCase(), c0:Math.min(ed.sel.c0, ed.sel.c1), c1:Math.max(ed.sel.c0, ed.sel.c1), r0:Math.min(ed.sel.r0, ed.sel.r1), r1:Math.max(ed.sel.r0, ed.sel.r1), eigen:true });
      ed.teller++; ed.sel = null; ed.sjabloon = 'eigen'; render(); });
    laag.querySelector('#v-sluit').onclick = sluitV;
    laag.querySelector('#v-ok').onclick = () => {
      bewaar();
      const op = S.blokken.filter(b => b.veld === V.id).map(b => ({ b, f: deelVan(V.id, b.deel), c: vakVan(V.id, b.deel) }));
      Object.assign(V, { K:ed.K, R:ed.R, vakken:ed.vakken, sjabloon:ed.sjabloon });
      let verzet = 0;
      op.forEach(({ b, f, c }) => {
        const zelfde = V.vakken.find(k => k.id === b.deel && Math.abs(deelVan(V.id, k.id) - f) < 1e-6);
        if (zelfde) return;
                const vrij = id => veldVrij(b.dag, V.id, id, b.start, b.eind, b.id);
        const kies = passend(V.id, f).map(k => k.id).find(vrij)
          || [...V.vakken].sort((p, q) => deelVan(V.id, q.id) - deelVan(V.id, p.id)).map(k => k.id).find(vrij)
          || (passend(V.id, f)[0] || V.vakken[0]).id;
        b.deel = kies; verzet++;
      });
      sluitV(); teken();
      meld(`${V.naam}: ${V.vakken.length} vakken opgeslagen.${verzet ? ` ${verzet} ${verzet === 1 ? 'training is' : 'trainingen zijn'} naar een passend vak gezet.` : ''}`);
    };
  };
  render();
}

function vensterDag(){
  const vandaag = new Date(2026, 10, 24);
  const data = []; for (let i = 0; i < 14; i++){ const d = new Date(vandaag); d.setDate(d.getDate() + i); const wd = d.getDay(); if (wd >= 1 && wd <= 5) data.push(d); }
  const MND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const lbl = d => `${DAGK[d.getDay()].toLowerCase()} ${d.getDate()} ${MND[d.getMonth()]}`;
  const st = { datum: 2, veld: 'v2', keuze: {} };
  const plan = () => {
    const d = data[st.datum], wd = d.getDay();
    const getroffen = S.blokken.filter(b => b.dag === wd && b.veld === st.veld && !b.voorstel);
    const anderen = S.blokken.filter(b => !(b.dag === wd && b.veld === st.veld));
    return getroffen.map(b => {
      let naar = null;
      for (const v of VELDEN){ if (v.id === st.veld || (!v.licht && b.eind > DONKER)) continue;
        const dl = passend(v.id, deelVan(b.veld, b.deel)).map(k => k.id).find(x => veldVrij(wd, v.id, x, b.start, b.eind, b.id, anderen));
        if (dl){ naar = { veld: v.id, deel: dl }; anderen.push({ ...b, veld:v.id, deel:dl, id:'tmp' + b.id }); break; } }
      return { b, naar, soort: st.keuze[b.id] || (naar ? 'verplaatst' : 'vervalt') };
    });
  };
  const render = () => {
    const p = plan(), d = data[st.datum];
    venster(`<h2 class="kop">Dag wijzigen</h2>
      <p class="zacht" style="margin:0">Voor één datum. Het basisrooster blijft gewoon staan.</p>
      <div><span class="veld-label">Datum</span><div class="keus">${data.map((x, i) => `<button type="button" data-dt="${i}" aria-pressed="${i === st.datum}">${lbl(x)}</button>`).join('')}</div></div>
      <div><span class="veld-label">Wat is er aan de hand?</span><div class="keus">${VELDEN.map(v => `<button type="button" data-vd="${v.id}" aria-pressed="${v.id === st.veld}">${v.naam} afgekeurd</button>`).join('')}</div></div>
      <div><span class="veld-label">Voorstel voor ${lbl(d)}</span>
      ${p.length ? `<ul class="wlijst">${p.map(x => `<li><span class="t">${x.b.team}</span><span style="flex:1;min-width:160px" class="num">${tt(x.b.start)}–${tt(x.b.eind)} · ${plekTekst(x.b)}<br>
        ${x.soort === 'verplaatst' && x.naar ? `<b>Naar ${plekTekst(x.naar)}</b>` : `<b style="color:var(--warn)">Vervalt</b>`}</span>
        <span class="segment" role="group" aria-label="Keuze ${x.b.team}"><button type="button" data-k="${x.b.id}|verplaatst" aria-pressed="${x.soort === 'verplaatst'}" ${x.naar ? '' : 'disabled'}>Verplaats</button><button type="button" data-k="${x.b.id}|vervalt" aria-pressed="${x.soort === 'vervalt'}">Vervalt</button></span></li>`).join('')}</ul>`
        : `<p class="zacht" style="margin:0">Op ${lbl(d)} traint niemand op ${VELD[st.veld].naam}.</p>`}</div>
      <label class="schakel"><input type="checkbox" checked id="dw-ber"><span><b>Bericht naar de teams die het raakt</b><br><span class="zacht">Zij zien op de Nu-kaart: ${(() => { const e = p.find(q => q.soort === 'verplaatst' && q.naar); return e ? `“Vandaag op ${VELD[e.naar.veld].naam} in plaats van ${VELD[st.veld].naam}”` : '“Deze training gaat niet door”'; })()}.</span></span></label>
      <div class="voet"><button type="button" class="knop" id="v-sluit">Annuleren</button><button type="button" class="knop fluo" id="v-ok" ${p.length ? '' : 'disabled'}>Opslaan</button></div>`);
    laag.querySelectorAll('[data-dt]').forEach(x => x.onclick = () => { st.datum = +x.dataset.dt; st.keuze = {}; render(); });
    laag.querySelectorAll('[data-vd]').forEach(x => x.onclick = () => { st.veld = x.dataset.vd; st.keuze = {}; render(); });
    laag.querySelectorAll('[data-k]').forEach(x => x.onclick = () => { const [id, s] = x.dataset.k.split('|'); st.keuze[id] = s; render(); });
    laag.querySelector('#v-sluit').onclick = sluitV;
    laag.querySelector('#v-ok').onclick = () => {
      const pp = plan(), v = pp.filter(x => x.soort === 'verplaatst').length, ve = pp.length - v;
      S.dagwijz = S.dagwijz.filter(x => x.datum !== st.datum);
      S.dagwijz.push({ datum: st.datum, weekdag: d.getDay(), label: `${lbl(d)}: ${VELD[st.veld].naam} dicht` });
      sluitV(); teken();
      meld(`${lbl(d)} opgeslagen: ${v} verplaatst, ${ve} ${ve === 1 ? 'vervalt' : 'vervallen'}.${laag ? '' : ''}`);
    };
  };
  render();
}

let toastT;
function meld(t){ clearTimeout(toastT); let el = document.getElementById('toast'); if (!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = t; el.hidden = false; toastT = setTimeout(() => el.hidden = true, 3600); }

/* ---------- interactie ---------- */
let speelt = null;
function koppel(){
  const $ = s => app.querySelector(s), $$ = s => app.querySelectorAll(s);
  $$('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; teken(); });
  $$('[data-dag]').forEach(b => b.onclick = () => { if (sleep && sleep.bewogen) return; S.dag = +b.dataset.dag; teken(); });
  $('#ongedaan').onclick = ongedaan;
  $('#vulaan').onclick = vulAan;
  $('#dagwijz').onclick = vensterDag;
  $('#publiceer').onclick = vensterPubliceer;
  $('#thema').onclick = () => { const r = document.documentElement; const donkerNu = r.dataset.theme ? r.dataset.theme === 'dark' : !matchMedia('(prefers-color-scheme: light)').matches;
    r.dataset.theme = donkerNu ? 'light' : 'dark'; teken(); };
  const neem = $('#neemover'); neem && (neem.onclick = () => { bewaar(); S.blokken.forEach(b => delete b.voorstel); teken(); meld('Voorstellen overgenomen. Ze tellen mee bij Publiceren.'); });
  const verw = $('#verwerp'); verw && (verw.onclick = () => { bewaar(); S.blokken = S.blokken.filter(b => !b.voorstel); teken(); meld('Voorstellen verworpen.'); });

  /* controle */
  const c = controleer();
  const lijst = [...c.lijst].sort((a, b) => (a.soort === b.soort ? 0 : a.soort === 'fout' ? -1 : 1) || (a.dag === S.dag ? -1 : b.dag === S.dag ? 1 : a.dag - b.dag));
  $$('[data-toon]').forEach(b => b.onclick = () => { const m = lijst[+b.dataset.toon]; S.dag = m.dag; S.view = 'tijdlijn'; S.sel = m.ids[0]; teken(); app.querySelector(`.blok[data-id="${m.ids[0]}"]`)?.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' }); });
  $$('[data-fix]').forEach(b => b.onclick = () => { const m = lijst[+b.dataset.fix], bl = blok(m.fix.id);
    bewaar();
    if (m.fix.soort === 'kk'){ const vrij = vrijeKk(bl.dag, bl.start, bl.eind, bl.id); if (vrij.length){ bl.kk = [vrij[0]]; meld(`${bl.team} krijgt kleedkamer ${vrij[0]}.`); } else meld('Geen kleedkamer vrij op dat moment.'); }
    else { const nodig = deelVan(bl.veld, bl.deel), vrijVak = v => passend(v.id, nodig).find(k => veldVrij(bl.dag, v.id, k.id, bl.start, bl.eind, bl.id));
      const v = VELDEN.find(v => v.licht && v.id !== bl.veld && vrijVak(v));
      if (v){ bl.deel = vrijVak(v).id; bl.veld = v.id; meld(`${bl.team} gaat naar ${v.naam}.`); } else meld('Geen veld met licht vrij op dat moment.'); }
    teken(); });

  /* detail */
  const sel = S.sel && blok(S.sel);
  if (sel){
    $('#sluit').onclick = () => { S.sel = null; teken(); };
    const wijzig = f => { bewaar(); f(sel); teken(); };
    $('#d-dag').onchange = e => { wijzig(b => b.dag = +e.target.value); S.dag = sel.dag; teken(); };
    $('#d-start').onchange = e => wijzig(b => { const duur = b.eind - b.start; b.start = +e.target.value; b.eind = Math.min(DAG_EIND, b.start + duur); });
    $('#d-eind').onchange = e => wijzig(b => b.eind = +e.target.value);
    $('#d-veld').onchange = e => wijzig(b => { const oud = deelVan(b.veld, b.deel); b.veld = e.target.value; const kies = passend(b.veld, oud); b.deel = (kies.find(k => veldVrij(b.dag, b.veld, k.id, b.start, b.eind, b.id)) || kies[0] || VELD[b.veld].vakken[0]).id; });
    $$('[data-deel]').forEach(x => x.onclick = () => wijzig(b => b.deel = x.dataset.deel));
    $$('[data-kkzet]').forEach(x => x.onclick = () => wijzig(b => { const k = +x.dataset.kkzet; b.kk = b.kk.includes(k) ? b.kk.filter(y => y !== k) : [...b.kk, k].sort((p, q) => p - q); }));
    $('#d-tel').onclick = () => vensterTel(sel);
    $('#d-weg').onclick = () => { bewaar(); S.blokken = S.blokken.filter(b => b.id !== sel.id); S.sel = null; teken(); meld(`${sel.team} staat weer bij Nog in te plannen.`); };
    const nm = $('#d-neem'); nm && (nm.onclick = () => wijzig(b => delete b.voorstel));
  }

  /* per team */
  $$('[data-dagteam]').forEach(td => td.onclick = () => { const [d, t] = td.dataset.dagteam.split('|'); const b = S.blokken.find(x => x.team === t && x.dag === +d);
    S.dag = +d; S.view = 'tijdlijn'; S.sel = b ? b.id : null; teken(); });

  /* kaart */
  const sch = $('#tijdschuif');
  if (sch){ sch.oninput = e => { S.kaartTijd = +e.target.value; teken(); app.querySelector('#tijdschuif')?.focus(); };
    $('#speel').onclick = () => { if (speelt){ clearInterval(speelt); speelt = null; teken(); return; }
      if (S.kaartTijd >= DAG_EIND - STAP) S.kaartTijd = DAG_START;
      speelt = setInterval(() => { S.kaartTijd += STAP; if (S.kaartTijd >= DAG_EIND - STAP){ clearInterval(speelt); speelt = null; } if (S.view !== 'kaart'){ clearInterval(speelt); speelt = null; return; } teken(); }, 450); teken(); }; }

  $$('[data-kmodus]').forEach(b => b.onclick = () => { S.kaartModus = b.dataset.kmodus; teken(); });
  $$('[data-indeling]').forEach(b => { b.onclick = () => vensterIndeling(b.dataset.indeling); b.onkeydown = e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); vensterIndeling(b.dataset.indeling); } }; });
  /* tijdlijn: slepen, toetsenbord, peillijn */
  $$('.blok').forEach(el => {
    el.addEventListener('pointerdown', e => startSleep(e, { soort: e.target.dataset.greep ? 'maat' : 'blok', id: el.dataset.id, el }));
    el.addEventListener('keydown', e => toets(e, el.dataset.id));
  });
  $$('.chip').forEach(el => {
    el.addEventListener('pointerdown', e => startSleep(e, { soort: 'nieuw', team: el.dataset.team, el }));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); plaatsSnel(el.dataset.team); } });
    el.onclick = e => { if (e.detail === 0) return; };
  });
  $$('.kk-chip').forEach(el => el.addEventListener('pointerdown', e => startSleep(e, { soort: 'kk', kk: +el.dataset.kk, el })));
  $$('.kk-bar').forEach(el => el.onclick = () => { S.sel = el.dataset.id; teken(); });
  const tl = $('#tl'), peil = $('#peil');
  if (tl && !S.smal){
    tl.addEventListener('pointermove', e => { if (sleep) return; const r = tl.getBoundingClientRect(), x = e.clientX - r.left - LAB;
      if (x < 0){ peil.hidden = true; return; } const m = DAG_START + Math.floor(x / slotW) * STAP; peil.hidden = false; peil.style.left = `${LAB + xVan(m)}px`; peil.firstElementChild.textContent = tt(m); });
    tl.addEventListener('pointerleave', () => peil.hidden = true);
  }
}

/* Plaats een team met Enter vanuit de zijbalk: eerste vrije plek op de gekozen dag */
function plaatsSnel(teamId){
  const t = TEAMS[teamId];
  for (let s = t.bouw === 'onder' ? tm('17:00') : tm('18:00'); s + t.duur <= DAG_EIND; s += STAP) for (const v of VELDEN){
    if (!v.licht && s + t.duur > DONKER) continue;
    const dl = passend(v.id, NODIG[t.maat]).map(k => k.id).find(d => veldVrij(S.dag, v.id, d, s, s + t.duur));
    if (dl){ bewaar(); const kk = vrijeKk(S.dag, s, s + t.duur); const nb = { id:'b' + (++teller), team:teamId, dag:S.dag, start:s, eind:s + t.duur, veld:v.id, deel:dl, kk: kk.length ? [kk[0]] : [] };
      S.blokken.push(nb); S.sel = nb.id; teken(); app.querySelector(`.blok[data-id="${nb.id}"]`)?.focus(); meld(`${teamId} staat op ${DAGEN[S.dag].toLowerCase()} ${tt(s)}, ${plekTekst(nb)}.`); return; }
  }
  meld(`Geen vrije plek voor ${teamId} op ${DAGEN[S.dag].toLowerCase()}.`);
}

function toets(e, id){
  const b = blok(id); if (!b) return;
  const t = TEAMS[b.team];
  const pijl = { ArrowLeft: [-STAP, 0], ArrowRight: [STAP, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); S.sel = id; teken(); app.querySelector('#d-dag')?.focus(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); bewaar(); S.blokken = S.blokken.filter(x => x.id !== id); if (S.sel === id) S.sel = null; teken(); meld(`${b.team} staat weer bij Nog in te plannen.`); return; }
  if (!pijl) return;
  e.preventDefault(); bewaar();
  if (pijl[0]){ const duur = b.eind - b.start; b.start = Math.max(DAG_START, Math.min(DAG_EIND - duur, b.start + pijl[0])); b.eind = b.start + duur; }
  else {
    /* omhoog/omlaag: volgend deel binnen het veld, daarna het volgende veld */
    const f = deelVan(b.veld, b.deel); const plekken = VELDEN.flatMap(v => { const z = v.vakken.filter(k => Math.abs(deelVan(v.id, k.id) - f) < 1e-6); return (z.length ? z : passend(v.id, f).slice(0, 1)).map(k => [v.id, k.id]); });
    const i = plekken.findIndex(p => p[0] === b.veld && p[1] === b.deel);
    const n = plekken[Math.max(0, Math.min(plekken.length - 1, i + pijl[1]))]; b.veld = n[0]; b.deel = n[1];
  }
  S.sel = id; teken(); app.querySelector(`.blok[data-id="${id}"]`)?.focus();
}

/* ---------- slepen ---------- */
let sleep = null;
function startSleep(e, info){
  if (e.button !== 0) return;
  if (S.smal && e.pointerType === 'touch' && info.soort !== 'kk'){ /* telefoon: tikken opent het blok */
    if (info.soort === 'blok' || info.soort === 'maat'){ S.sel = info.id; teken(); } else if (info.soort === 'nieuw') plaatsSnel(info.team);
    e.preventDefault(); return; }
  e.preventDefault();
  sleep = { ...info, x0: e.clientX, y0: e.clientY, bewogen: false, pid: e.pointerId };
  if (info.soort === 'blok' || info.soort === 'maat'){
    const b = blok(info.id), r = info.el.getBoundingClientRect();
    sleep.b = b; sleep.grab = e.clientX - r.left; sleep.duur = b.eind - b.start;
  }
  if (info.soort === 'nieuw'){ const t = TEAMS[info.team]; sleep.duur = t.duur; sleep.grab = 20; }
  window.addEventListener('pointermove', beweeg);
  window.addEventListener('pointerup', los, { once: true });
  window.addEventListener('pointercancel', annuleer, { once: true });
}
function zweef(tekst, x, y){ let z = document.getElementById('zweef'); if (!z){ z = document.createElement('div'); z.id = 'zweef'; z.className = 'zweef'; document.body.appendChild(z); }
  z.innerHTML = tekst; z.style.left = `${x + 14}px`; z.style.top = `${y + 14}px`; z.hidden = false; }
function weg(){ document.getElementById('zweef')?.remove(); document.querySelectorAll('.spook').forEach(x => x.remove());
  document.querySelectorAll('.dagk.drop, .zij.drop, .blok.kkdoel').forEach(x => x.classList.remove('drop', 'kkdoel')); }

function doel(e){
  /* bepaal veld, deel en tijd onder de aanwijzer */
  const banen = [...document.querySelectorAll('.baan[data-veld]')];
  const t = sleep.soort === 'nieuw' ? TEAMS[sleep.team] : TEAMS[sleep.b.team];
  let baan = null;
  for (const b of banen){ const r = b.getBoundingClientRect(); if (e.clientY >= r.top - 6 && e.clientY <= r.bottom + 6 && e.clientX >= r.left - 40 && e.clientX <= r.right + 20){ baan = b; break; } }
  if (!baan) return null;
  const r = baan.getBoundingClientRect();
  const V = VELD[baan.dataset.veld], L = V.K * V.R;
  const lane = Math.max(0, Math.min(L - 1, Math.floor((e.clientY - r.top) / baanH(V))));
  const doelDeel = sleep.b ? deelVan(sleep.b.veld, sleep.b.deel) : NODIG[t.maat];
  const bevat = V.vakken.filter(k => cellen(V.id, k.id).includes(lane));
  const kies = bevat.filter(k => deelVan(V.id, k.id) >= doelDeel - 1e-6).sort((a, b) => deelVan(V.id, a.id) - deelVan(V.id, b.id))[0]
    || bevat.sort((a, b) => deelVan(V.id, b.id) - deelVan(V.id, a.id))[0];
  const deel = kies.id;
  let start = DAG_START + Math.round((e.clientX - r.left - sleep.grab) / slotW) * STAP;
  start = Math.max(DAG_START, Math.min(DAG_EIND - sleep.duur, start));
  return { baan, veld: baan.dataset.veld, deel, start, eind: start + sleep.duur, t };
}
function beoordeel(d, id){
  const vrij = veldVrij(S.dag, d.veld, d.deel, d.start, d.eind, id);
  if (!vrij) return { klas: 'fout', tekst: 'Bezet' };
  const w = [];
  if (d.t.bouw === 'onder' && d.eind > ONDER_TOT) w.push('laat voor onderbouw');
  if (!VELD[d.veld].licht && d.eind > DONKER) w.push('geen licht');
  if (S.blokken.some(b => b.id !== id && b.dag === S.dag && overlap(d.start, d.eind, b.start, b.eind) && TEAMS[b.team].trainers.some(x => d.t.trainers.includes(x)) && b.team !== d.t.id)) w.push('trainer dubbel');
  if (deelVan(d.veld, d.deel) < NODIG[d.t.maat] - 1e-6) w.push('vak te klein');
  return w.length ? { klas: 'warn', tekst: w.join(', ') } : { klas: '', tekst: 'Past' };
}
function beweeg(e){
  if (!sleep) return;
  if (!sleep.bewogen && Math.hypot(e.clientX - sleep.x0, e.clientY - sleep.y0) < 4) return;
  if (!sleep.bewogen){ sleep.bewogen = true; if (sleep.el && sleep.soort === 'blok') sleep.el.classList.add('slepend'); }
  document.querySelectorAll('.spook').forEach(x => x.remove());
  document.querySelectorAll('.dagk.drop, .zij.drop, .blok.kkdoel').forEach(x => x.classList.remove('drop', 'kkdoel'));
  sleep.doel = null; sleep.naarDag = null; sleep.naarZij = false; sleep.kkDoel = null;

  if (sleep.soort === 'kk'){
    const onder = document.elementFromPoint(e.clientX, e.clientY)?.closest('.blok');
    if (onder){ onder.classList.add('kkdoel'); sleep.kkDoel = onder.dataset.id; const b = blok(onder.dataset.id); const bez = kkBezetter(b.dag, sleep.kk, b);
      zweef(`Kleedkamer ${sleep.kk} naar ${b.team}${bez ? ` <span style="opacity:.75">· al bezet door ${bez.team}</span>` : ''}`, e.clientX, e.clientY); }
    else zweef(`Kleedkamer ${sleep.kk}: sleep naar een team`, e.clientX, e.clientY);
    return;
  }
  if (sleep.soort === 'maat'){
    const b = sleep.b, r = sleep.el.parentElement.getBoundingClientRect();
    let eind = DAG_START + Math.round((e.clientX - r.left) / slotW) * STAP;
    eind = Math.max(b.start + 30, Math.min(DAG_EIND, eind));
    sleep.nieuwEind = eind;
    sleep.el.style.width = `${xVan(eind) - xVan(b.start) - 2}px`;
    zweef(`${b.team} · ${tt(b.start)}–${tt(eind)} · ${eind - b.start} min`, e.clientX, e.clientY);
    return;
  }
  const dagEl = document.elementFromPoint(e.clientX, e.clientY)?.closest('.dagk');
  if (dagEl && sleep.soort === 'blok' && +dagEl.dataset.dag !== S.dag){ dagEl.classList.add('drop'); sleep.naarDag = +dagEl.dataset.dag;
    zweef(`Naar ${DAGEN[sleep.naarDag].toLowerCase()}, zelfde tijd en veld`, e.clientX, e.clientY); return; }
  const zij = document.elementFromPoint(e.clientX, e.clientY)?.closest('#zij');
  if (zij && sleep.soort === 'blok'){ zij.classList.add('drop'); sleep.naarZij = true; zweef('Uit het rooster halen', e.clientX, e.clientY); return; }
  const d = doel(e);
  const naam = sleep.soort === 'nieuw' ? sleep.team : sleep.b.team;
  if (!d){ zweef(`${naam}: sleep naar een veld`, e.clientX, e.clientY); return; }
  const oordeel = beoordeel(d, sleep.b?.id);
  sleep.doel = d;
  const hV = baanH(VELD[d.veld]);
  looptjes(cellen(d.veld, d.deel)).forEach(([l0, l1], i) => {
    const sp = document.createElement('div');
    sp.className = `spook ${oordeel.klas}`;
    sp.style.cssText = `left:${xVan(d.start)}px;width:${xVan(d.eind) - xVan(d.start)}px;top:${l0 * hV}px;height:${(l1 - l0 + 1) * hV}px`;
    if (!i) sp.textContent = `${tt(d.start)}–${tt(d.eind)}`;
    d.baan.appendChild(sp); });
  zweef(`<b>${naam}</b> · ${plekTekst(d)} · ${tt(d.start)}<br>${oordeel.klas === 'fout' ? '✕ ' : oordeel.klas === 'warn' ? '! ' : '✓ '}${oordeel.tekst}`, e.clientX, e.clientY);
}
function los(e){
  window.removeEventListener('pointermove', beweeg);
  window.removeEventListener('pointercancel', annuleer);
  const s = sleep; weg();
  if (!s) return;
  setTimeout(() => { sleep = null; }, 0);
  if (!s.bewogen){
    if (s.soort === 'blok' || s.soort === 'maat'){ S.sel = s.id; teken(); }
    else if (s.soort === 'nieuw') plaatsSnel(s.team);
    return;
  }
  if (s.soort === 'kk'){
    if (s.kkDoel){ bewaar(); const b = blok(s.kkDoel); b.kk = [s.kk]; S.sel = b.id; teken(); meld(`${b.team} krijgt kleedkamer ${s.kk}.`); } else teken();
    return;
  }
  if (s.soort === 'maat'){ if (s.nieuwEind){ bewaar(); s.b.eind = s.nieuwEind; } S.sel = s.b.id; teken(); return; }
  if (s.naarZij){ bewaar(); S.blokken = S.blokken.filter(b => b.id !== s.b.id); if (S.sel === s.b.id) S.sel = null; teken(); meld(`${s.b.team} staat weer bij Nog in te plannen.`); return; }
  if (s.naarDag){ bewaar(); s.b.dag = s.naarDag; S.dag = s.naarDag; S.sel = s.b.id; teken(); meld(`${s.b.team} staat nu op ${DAGEN[s.naarDag].toLowerCase()}.`); return; }
  if (!s.doel){ teken(); return; }
  const d = s.doel;
  bewaar();
  if (s.soort === 'nieuw'){
    const kk = vrijeKk(S.dag, d.start, d.eind);
    const nb = { id:'b' + (++teller), team:s.team, dag:S.dag, start:d.start, eind:d.eind, veld:d.veld, deel:d.deel, kk: kk.length ? [kk[0]] : [] };
    S.blokken.push(nb); S.sel = nb.id;
    meld(`${s.team} ingepland${kk.length ? `, kleedkamer ${kk[0]} gekozen` : ', nog geen kleedkamer vrij'}.`);
  } else {
    const b = s.b; b.start = d.start; b.eind = d.eind; b.veld = d.veld; b.deel = d.deel;
    if (b.kk.length && b.kk.some(k => kkBezetter(b.dag, k, b))){ const vrij = vrijeKk(b.dag, b.start, b.eind, b.id); if (vrij.length){ b.kk = [vrij[0]]; meld(`Kleedkamer was bezet: ${b.team} krijgt kleedkamer ${vrij[0]}.`); } }
    S.sel = b.id;
  }
  teken();
}
function annuleer(){ window.removeEventListener('pointermove', beweeg); weg(); sleep = null; teken(); }

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(teken, 120); });
teken(); teken(); /* tweede keer: breedte van de tijdlijn is nu bekend */
})();
</script>
