# [20261127w] Publiceert public/ ook op Firebase Hosting (cluppie-ad329.web.app), naast GitHub Pages.
# Zolang www.cluppie.io in de DNS nog naar GitHub Pages wijst, is dit een tweede adres om te testen.
# Na de DNS-overstap (zie docs/firebase-hosting.md) is dit de echte site.
name: Deploy naar Firebase Hosting
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firebase.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-hosting
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inloggen bij Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Hosting deployen
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --message "${GITHUB_SHA::7}" \
            --non-interactive
