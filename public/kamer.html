<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0e1116">
<title>Teamkamer · Cluppie</title>
<script>
/* Demo (kamer.html?demo=ouder of ?demo=speler): dezelfde pagina, maar js/firebase.js wordt vervangen door
   js/firebase-demo.js, een database in het geheugen. Niets gaat naar Firebase. Zelfde afspraak als index.html:
   DEMO_VERSIE is de ?v= waarmee de modules firebase.js importeren. */
(function(){
  if (!/[?&]demo(=|&|$)/.test(location.search)) return;
  var DEMO_VERSIE = '20261011g';
  var kaart = { imports: {} };
  kaart.imports[new URL('js/firebase.js?v=' + DEMO_VERSIE, location.href).href] = new URL('js/firebase-demo.js', location.href).href;
  var s = document.createElement('script'); s.type = 'importmap'; s.textContent = JSON.stringify(kaart);
  document.currentScript.after(s);
  try { ['getItem', 'setItem', 'removeItem'].forEach(function(m){ var o = Storage.prototype[m];
    Storage.prototype[m] = function(k){ var a = [].slice.call(arguments); a[0] = 'cluppieDemo:' + k; return o.apply(this, a); }; }); } catch (e) { /* geen opslag */ }
})();
</script>
<script>
/* Thema-gate (vóór paint), zelfde afspraak en dezelfde sleutels als index.html: wie in de app licht of
   donker koos (of een club die het afdwingt) ziet de teamkamer in hetzelfde thema. Zonder keuze: donker,
   tenzij het systeem licht vraagt. */
(function(){
  var t = 'donker';
  try {
    var dwang = localStorage.getItem('cluppieThemaDwang'), eigen = localStorage.getItem('cluppieThemaEigen'), deflt = localStorage.getItem('cluppieThemaDefault');
    if (dwang === 'donker' || dwang === 'licht') t = dwang;
    else if (eigen === 'donker' || eigen === 'licht') t = eigen;
    else if (deflt === 'licht') t = 'licht';
    else t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'licht' : 'donker';
  } catch (e) { /* geen opslag: donker */ }
  document.documentElement.setAttribute('data-thema', t);
  var mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute('content', t === 'licht' ? '#e9edf2' : '#0e1116');
})();
</script>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<body>

     geen teams.js, geen state.js, en alleen de kopie teamkamer/{teamId} wordt gelezen. Zie js/kamer-app.js. -->
<div id="tk" class="tk-app">
  <div class="tk-smal"><div class="tk-kop"><div class="tk-merkregel"><img class="tk-merk" src="icons/icon.svg" alt="" width="40" height="40"><span><b>Cluppie</b><small>Teamkamer laden…</small></span></div></div></div>
  <noscript><p style="padding:16px">De teamkamer werkt alleen met JavaScript aan.</p></noscript>
</div>
<script type="module" src="js/kamer-app.js?v=20261116r"></script>
</body>
