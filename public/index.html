<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cluppie - Youth Football Club Management System">
  <meta name="theme-color" content="#4CAF50">
  <title>Cluppie - Club Management</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon192.png">
  <link rel="apple-touch-icon" href="/appletouchicon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { initApp } from './js/main.js';

    // Initialize the app when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        const appRoot = document.getElementById('app');
        initApp(appRoot);
      });
    } else {
      const appRoot = document.getElementById('app');
      initApp(appRoot);
    }

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => console.log('SW registered:', registration))
        .catch(error => console.log('SW registration failed:', error));
    }
  </script>
</body>
</html>
