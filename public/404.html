<!doctype html>

<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>Cluppie</title>
<script>
/* [20261127b] Korte link naar de kantine-tv: /tv/<naam> gaat naar de app met ?kantine=<naam> (zie js/scherm-boot.js).
   GitHub Pages toont deze pagina voor elk adres dat niet bestaat. Al het andere gaat naar de startpagina. */
(function(){
  var m = /^\/tv\/([a-z0-9-]{1,30})\/?$/i.exec(location.pathname);
  location.replace(m ? '/?kantine=' + m[1].toLowerCase() : '/');
})();
</script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1a14;color:#fff;font:16px system-ui,sans-serif}a{color:#fff}</style>
</head>
<body><p>Even geduld… <a href="/">Naar Cluppie</a></p></body>
